<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seismisk Netværk — Sans Science</title>
<style>
:root { --navy: #0a0f3c; --warm: #f5f0e8; --cyan: #00b4d8; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--navy); color: var(--warm); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.card { text-align: center; max-width: 360px; padding: 40px 20px; }
.logo { font-size: 16px; font-weight: 500; margin-bottom: 20px; letter-spacing: .02em; }
.logo span { color: var(--cyan); }
h1 { font-size: 22px; margin-bottom: 6px; }
.sub { font-size: 12px; opacity: .4; margin-bottom: 30px; }
.links { display: flex; flex-direction: column; gap: 10px; }
a { display: block; padding: 14px; border-radius: 10px; text-decoration: none; font-weight: 600; font-size: 14px; transition: transform .1s; }
a:active { transform: scale(.97); }
.link-dash { background: var(--cyan); color: var(--navy); }
.link-station { background: rgba(255,255,255,.06); color: var(--warm); border: 1px solid rgba(255,255,255,.1); }
</style>
</head>
<body>
<div class="card">
  <div class="logo">sans<span>·</span>science</div>
  <h1>Seismisk Netværk</h1>
  <div class="sub">Kom til kernen — med Inge Lehmann</div>
  <div class="links">
    <a href="/dashboard.html" class="link-dash">Åbn dashboard (lærer)</a>
    <a href="/station.html" class="link-station">Tilslut som station (elev)</a>
  </div>
</div>
</body>
</html>
